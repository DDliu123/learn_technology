<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订阅账单管家 · 网页版</title>
    <meta name="description" content="网页版订阅账单管家：统计月度与年度订阅支出。" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>订阅账单管家</h1>
      <p>同一个产品，从命令行搬到浏览器</p>
    </header>

    <main class="container">
      <!-- 概览区：内容由 JS 渲染，HTML 里只留空容器 -->
      <section class="stats" id="stats" aria-label="支出概览"></section>

      <section class="card">
        <div class="card-head">
          <h2>我的订阅</h2>
          <div class="actions">
            <button type="button" id="sort-date">按下次扣费排序</button>
            <button type="button" id="sort-price">按月费排序</button>
          </div>
        </div>

        <table class="bill-table">
          <thead>
            <tr>
              <th>名称</th>
              <th class="num">月费</th>
              <th>分类</th>
              <th>下次扣费</th>
            </tr>
          </thead>
          <tbody id="bill-body"></tbody>
        </table>

        <p class="empty" id="empty-tip" hidden>还没有订阅记录。</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>阶段 3 · 前端 JavaScript &nbsp;·&nbsp; <a href="https://github.com/DDliu123/learn_technology">源码仓库</a></p>
    </footer>

    <!-- defer：等 HTML 解析完再执行脚本，这样 JS 里一定能查到 DOM 元素 -->
    <script src="app.js" defer></script>
  </body>
</html>
